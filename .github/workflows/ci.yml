name: CI

on:
  push:
    branches: [main]
  pull_request:

# The size contract is defined on Rust 1.85 (see CLAUDE.md). The repo
# deliberately carries no rust-toolchain.toml, because the FreeBSD and Solaris
# test machines build with their pkg-installed toolchains; the version is
# pinned here instead, where only CI is affected.
env:
  DUN_RUST: "1.85.0"
  CARGO_TERM_COLOR: always
  # tmux waits are calibrated on a developer laptop. Shared runners are slower
  # -- arm64 most of all, where a Python plugin host's handshake has timed out
  # a correct test -- so stretch the waiting, not the assertions. See
  # scaled_timeout in crates/dun-cli/tests/support/tmux.rs.
  DUN_TEST_TIMEOUT_FACTOR: "4"

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust ${{ env.DUN_RUST }}
        run: |
          rustup toolchain install "$DUN_RUST" --profile minimal \
            --component rustfmt,clippy
          rustup default "$DUN_RUST"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust ${{ env.DUN_RUST }}
        run: |
          rustup toolchain install "$DUN_RUST" --profile minimal
          rustup default "$DUN_RUST"

      # tmux and expect are not optional. Six test files skip cleanly when
      # they are missing, which would leave the suite green while running
      # materially less than it claims. Install them, then prove they are
      # there, so a packaging change cannot quietly hollow out the run.
      - name: Install tmux and expect (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux expect
      - name: Install tmux and expect (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux expect
      - name: Verify the test tools are present
        run: |
          tmux -V
          expect -v
      - run: cargo test --workspace --no-fail-fast

  scripts:
    name: install round trip
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust ${{ env.DUN_RUST }}
        run: |
          rustup toolchain install "$DUN_RUST" --profile minimal
          rustup default "$DUN_RUST"
      # Check each script with the interpreter its shebang names. A blanket
      # `sh -n` passes on macOS, where /bin/sh is bash, and fails on Ubuntu,
      # where it is dash -- so it would have been checking a different language
      # than the one that runs the script.
      - name: Check shell syntax
        run: |
          set -eu
          for script in scripts/*.sh scripts/hooks/*; do
            case "$(head -n 1 "$script")" in
              *bash*) bash -n "$script" ;;
              *) sh -n "$script" ;;
            esac
          done
      - run: cargo build --release -p dun-cli
      # Stage 11 found two install defects by *running* the editor rather than
      # listing files, so this installs, runs the binary, and uninstalls.
      - name: Install, run, uninstall
        run: |
          set -eux
          prefix="$RUNNER_TEMP/dun-prefix"
          HOME="$RUNNER_TEMP/fakehome"
          mkdir -p "$HOME"
          export HOME
          sh scripts/install.sh --yes --prefix "$prefix"
          "$prefix/bin/dun" --version
          "$prefix/bin/dun" --dump-config | head -1
          test -d "$prefix/share/dun/i18n"
          sh scripts/uninstall.sh --yes --prefix "$prefix"
          test ! -e "$prefix/bin/dun"

  docs:
    name: doc links
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The repository already ships a stricter checker than anything worth
      # writing here: it follows inline links, reference definitions and bare
      # repository-path mentions in prose, which is what catches a moved file
      # referenced from a brief. Call it rather than maintaining a second,
      # weaker implementation that can drift.
      - name: Check local links resolve
        run: python3 scripts/check-links.py

  size:
    name: size gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Two separate questions, previously conflated into one report-only job.
    # "Does it build and is it under 1 MiB" is a coarse check a hosted runner
    # can answer, and it blocks. "Did it move by 400 bytes" is a comparison
    # only the reference machines can make, and it is reported, never enforced
    # here. arm64 is absent from both: a different ISA cannot be judged against
    # a contract defined on x86_64.
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel is the last x86_64 macOS image and expires August 2027.
        os: [ubuntu-24.04, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust ${{ env.DUN_RUST }} with rust-src
        run: |
          rustup toolchain install "$DUN_RUST" --profile minimal \
            --component rust-src
          rustup default "$DUN_RUST"
      - name: Build with the size-audit contract
        run: sh scripts/release-build.sh | tee size.txt
      # Blocking. release-build.sh failing outright already fails this step;
      # this adds the ceiling. Both were previously unenforced because the job
      # carried continue-on-error.
      - name: Enforce the 1 MiB ceiling
        run: |
          set -eu
          bytes=$(sed -n 's/^size: *\([0-9]*\).*/\1/p' size.txt)
          if [ -z "$bytes" ]; then
            echo "could not parse a size from release-build.sh output" >&2
            exit 1
          fi
          echo "$bytes bytes"
          if [ "$bytes" -gt 1048576 ]; then
            echo "over the 1,048,576-byte ceiling by $((bytes - 1048576))" >&2
            exit 1
          fi
      - name: Report
        run: |
          bytes=$(sed -n 's/^size: *\([0-9]*\).*/\1/p' size.txt)
          {
            echo "### Size (${{ matrix.os }})"
            echo ""
            echo "\`$bytes\` bytes, ceiling 1048576."
            echo ""
            echo "This runner is not one of the reference machines, so the exact byte"
            echo "count is not comparable with docs/dev/release-size-audit.md. Only the"
            echo "ceiling above is enforced here."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: size-${{ matrix.os }}
          path: size.txt
